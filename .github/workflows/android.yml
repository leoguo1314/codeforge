name: Android CI

on:
  push:
    paths:
      - "apps/android/**"
      - "apps/web/src/wsTransport.ts"
      - "apps/web/src/wsTransport.test.ts"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - "apps/web/src/wsTransport.ts"
      - "apps/web/src/wsTransport.test.ts"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build debug APK
        run: gradle -p apps/android assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: codeforge-android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
