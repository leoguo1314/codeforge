name: Android CI

on:
  push:
    paths:
      - "apps/android/**"
      - "apps/web/src/androidBridge.ts"
      - "apps/web/src/androidBridge.test.ts"
      - "apps/web/src/components/AndroidDeviceRegistration.tsx"
      - "apps/web/src/components/AndroidThreadIntegration.tsx"
      - "apps/web/src/components/MobilePushOpsLauncher.tsx"
      - "apps/web/src/components/PairAndroidLauncher.tsx"
      - "apps/web/src/lib/qrCode.ts"
      - "apps/web/src/lib/qrCode.test.ts"
      - "apps/web/src/mobileAdminHttp.ts"
      - "apps/web/src/routes/_chat.tsx"
      - "apps/web/src/routes/_chat.$threadId.tsx"
      - "apps/web/src/main.tsx"
      - "apps/web/src/wsNativeApi.ts"
      - "apps/web/src/wsTransport.ts"
      - "apps/web/src/wsTransport.test.ts"
      - "apps/web/src/wsTransport.mobile.test.ts"
      - "apps/server/src/mobile/**"
      - "apps/server/src/persistence/Migrations.ts"
      - "apps/server/src/persistence/Migrations/021_MobilePushDevices.ts"
      - "apps/server/src/persistence/Migrations/022_MobilePushOutbox.ts"
      - "apps/server/src/persistence/Migrations/023_MobilePairingSessions.ts"
      - "apps/server/src/serverLayers.ts"
      - "apps/server/src/wsServer.ts"
      - "apps/server/src/wsServerCore.ts"
      - "apps/server/src/wsServer/pushBus.ts"
      - "apps/server/src/wsServer/pushBus.test.ts"
      - "apps/server/src/wsServer/mobileNotifications.ts"
      - "apps/server/src/wsServer/mobileNotifications.test.ts"
      - "apps/server/tsconfig.mobile.json"
      - "packages/contracts/src/ipc.ts"
      - "packages/contracts/src/mobile.ts"
      - "packages/contracts/src/ws.ts"
      - "scripts/mobile-push-gateway.mjs"
      - "scripts/mobile-push-gateway.test.mjs"
      - "turbo.json"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - "apps/web/src/androidBridge.ts"
      - "apps/web/src/androidBridge.test.ts"
      - "apps/web/src/components/AndroidDeviceRegistration.tsx"
      - "apps/web/src/components/AndroidThreadIntegration.tsx"
      - "apps/web/src/components/MobilePushOpsLauncher.tsx"
      - "apps/web/src/components/PairAndroidLauncher.tsx"
      - "apps/web/src/lib/qrCode.ts"
      - "apps/web/src/lib/qrCode.test.ts"
      - "apps/web/src/mobileAdminHttp.ts"
      - "apps/web/src/routes/_chat.tsx"
      - "apps/web/src/routes/_chat.$threadId.tsx"
      - "apps/web/src/main.tsx"
      - "apps/web/src/wsNativeApi.ts"
      - "apps/web/src/wsTransport.ts"
      - "apps/web/src/wsTransport.test.ts"
      - "apps/web/src/wsTransport.mobile.test.ts"
      - "apps/server/src/mobile/**"
      - "apps/server/src/persistence/Migrations.ts"
      - "apps/server/src/persistence/Migrations/021_MobilePushDevices.ts"
      - "apps/server/src/persistence/Migrations/022_MobilePushOutbox.ts"
      - "apps/server/src/persistence/Migrations/023_MobilePairingSessions.ts"
      - "apps/server/src/serverLayers.ts"
      - "apps/server/src/wsServer.ts"
      - "apps/server/src/wsServerCore.ts"
      - "apps/server/src/wsServer/pushBus.ts"
      - "apps/server/src/wsServer/pushBus.test.ts"
      - "apps/server/src/wsServer/mobileNotifications.ts"
      - "apps/server/src/wsServer/mobileNotifications.test.ts"
      - "apps/server/tsconfig.mobile.json"
      - "packages/contracts/src/ipc.ts"
      - "packages/contracts/src/mobile.ts"
      - "packages/contracts/src/ws.ts"
      - "scripts/mobile-push-gateway.mjs"
      - "scripts/mobile-push-gateway.test.mjs"
      - "turbo.json"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  web-mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test push gateway provider payloads
        run: node --test scripts/mobile-push-gateway.test.mjs

      - name: Test Android web integration
        run: bun run --cwd apps/web test -- src/wsTransport.test.ts src/wsTransport.mobile.test.ts src/androidBridge.test.ts src/lib/qrCode.test.ts

      - name: Typecheck web
        run: bun run --cwd apps/web typecheck

      - name: Typecheck shared contracts
        run: bun run --cwd packages/contracts typecheck

      - name: Typecheck mobile server modules
        run: bun x --package typescript@5.7.3 tsc -p apps/server/tsconfig.mobile.json --noEmit

      - name: Test mobile server pairing, notification, push bus, outbox, and delivery wiring
        run: bun run --cwd apps/server test -- src/wsServer/mobileNotifications.test.ts src/wsServer/pushBus.test.ts src/mobile/mobileWiring.test.ts src/mobile/MobilePairing.test.ts src/mobile/PushOutbox.test.ts

      - name: Build CodeForge server
        run: bun run --cwd apps/server build

  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build debug APK
        run: gradle -p apps/android assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: codeforge-android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
